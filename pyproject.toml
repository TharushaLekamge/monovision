[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monovision"
version = "0.1.0"
description = "Monocular 3D reconstruction in poorly visible environments (AU-GAN port + SimpleRecon pipeline)"
requires-python = ">=3.9"
dependencies = ["torch>=1.10", "numpy", "pillow", "pyyaml"]

[tool.setuptools.packages.find]
include = ["monovision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
